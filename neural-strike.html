<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>NEURAL STRIKE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Courier New',monospace}
#c{display:block;width:100vw;height:100vh;cursor:none}
#ui{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;color:#fff}
#cross{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:24px;height:24px}
#cross::before,#cross::after{content:'';position:absolute;background:#fff}
#cross::before{top:50%;left:0;width:100%;height:1.5px;transform:translateY(-50%)}
#cross::after{left:50%;top:0;height:100%;width:1.5px;transform:translateX(-50%)}
#hud{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:48px}
.s{text-align:center}.sv{font-size:32px;font-weight:700;letter-spacing:2px}.sl{font-size:10px;letter-spacing:3px;color:#666;margin-top:3px}
#hv{color:#f44}.#av{color:#4af}.#scv{color:#fc0}.#wv{color:#a6f}
#hit{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#f44;font-size:30px;opacity:0;pointer-events:none;transition:opacity .08s}
#dmg{position:absolute;inset:0;background:rgba(255,0,0,0);pointer-events:none;transition:background .15s}
#wann{position:absolute;top:26%;left:50%;transform:translate(-50%,-50%);font-size:38px;letter-spacing:10px;color:#fff;opacity:0;transition:opacity .5s;text-align:center;pointer-events:none}
#rbar{position:absolute;bottom:72px;left:50%;transform:translateX(-50%);width:160px;height:3px;background:rgba(255,255,255,.15);display:none}
#rfill{height:100%;background:#4af;width:0%;transition:width 1.5s linear}
#hint{position:absolute;top:14px;right:18px;font-size:11px;color:#444;line-height:2;text-align:right;letter-spacing:1px}
#ss{position:absolute;inset:0;background:rgba(0,0,0,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;pointer-events:all}
#ss h1{font-size:62px;letter-spacing:14px;color:#fff}
#ss p{color:#555;letter-spacing:4px;font-size:12px}
.btn{padding:13px 46px;background:transparent;border:1px solid rgba(255,255,255,.45);color:#fff;font-family:'Courier New',monospace;font-size:14px;letter-spacing:6px;cursor:pointer;transition:all .2s;pointer-events:all;margin-top:6px}
.btn:hover{background:#fff;color:#000;border-color:#fff}
#go{position:absolute;inset:0;background:rgba(0,0,0,.93);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;pointer-events:all}
#go h1{font-size:52px;letter-spacing:8px;color:#f33}
#fs{font-size:20px;color:#fc0;letter-spacing:5px}
#nolock{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.85);border:1px solid #444;color:#fff;padding:24px 40px;text-align:center;display:none;pointer-events:none;font-size:13px;line-height:2;letter-spacing:1px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="cross"></div>
  <div id="hit">✕</div>
  <div id="dmg"></div>
  <div id="hud">
    <div class="s"><div class="sv" id="scv" style="color:#fc0">0</div><div class="sl">SCORE</div></div>
    <div class="s"><div class="sv" id="hv" style="color:#f44">100</div><div class="sl">HP</div></div>
    <div class="s"><div class="sv" id="av" style="color:#4af">30</div><div class="sl">AMMO</div></div>
    <div class="s"><div class="sv" id="wv" style="color:#a6f">1</div><div class="sl">WAVE</div></div>
  </div>
  <div id="rbar"><div id="rfill"></div></div>
  <div id="wann"></div>
  <div id="hint">WASD 移動<br>滑鼠 轉向<br>左鍵 / 空白 射擊<br>R 換彈</div>
</div>
<div id="ss">
  <h1>NEURAL STRIKE</h1>
  <p>FIRST PERSON COMBAT</p>
  <button class="btn" id="sbtn">[ PLAY ]</button>
</div>
<div id="go">
  <h1>GAME OVER</h1>
  <div id="fs"></div>
  <button class="btn" id="rbtn">[ RETRY ]</button>
</div>
<div id="nolock">點擊畫面以鎖定滑鼠<br>按 ESC 可解鎖</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ── renderer ──────────────────────────────────────
const canvas=document.getElementById('c');
let W=innerWidth,H=innerHeight;
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setSize(W,H);renderer.shadowMap.enabled=true;
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x06060f);
scene.fog=new THREE.Fog(0x06060f,28,95);
const camera=new THREE.PerspectiveCamera(75,W/H,.1,200);
camera.position.set(0,1.7,0);
scene.add(camera);

// ── lights ────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x111122,2));
const sun=new THREE.DirectionalLight(0x5566ff,2.5);
sun.position.set(10,20,10);sun.castShadow=true;scene.add(sun);
const rl=new THREE.PointLight(0xff1133,5,40);rl.position.set(-18,7,-18);scene.add(rl);
const bl=new THREE.PointLight(0x1133ff,5,40);bl.position.set(18,7,18);scene.add(bl);

// ── floor ─────────────────────────────────────────
const flr=new THREE.Mesh(new THREE.PlaneGeometry(100,100),
  new THREE.MeshLambertMaterial({color:0x0a0a18}));
flr.rotation.x=-Math.PI/2;flr.receiveShadow=true;scene.add(flr);
scene.add(new THREE.GridHelper(100,50,0x1a1a44,0x0e0e22));

// ── boundary walls ─────────────────────────────────
function mkWall(w,h,d,x,y,z){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),
    new THREE.MeshLambertMaterial({color:0x0c0c20}));
  m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);
}
mkWall(100,12,1,0,6,-50);mkWall(100,12,1,0,6,50);
mkWall(1,12,100,-50,6,0);mkWall(1,12,100,50,6,0);

// ── cover objects ──────────────────────────────────
[[-12,0,-12],[12,0,-12],[-12,0,12],[12,0,12],
 [0,0,-28],[-22,0,-5],[22,0,-5],[0,0,28],
 [-26,0,22],[26,0,22],[-9,0,-38],[9,0,-38],
 [-20,0,-26],[20,0,-26],[0,0,-42]
].forEach(([x,,z])=>{
  const h=2.5+Math.random()*3;
  const m=new THREE.Mesh(
    new THREE.BoxGeometry(2+Math.random()*2.5,h,2+Math.random()*2.5),
    new THREE.MeshLambertMaterial({color:0x10102a}));
  m.position.set(x,h/2,z);m.castShadow=true;scene.add(m);
});

// ── gun model ─────────────────────────────────────
const gunG=new THREE.Group();
const gmat=new THREE.MeshLambertMaterial({color:0x222235});
const barrel=new THREE.Mesh(new THREE.CylinderGeometry(.022,.022,.48,8),gmat);
barrel.rotation.x=Math.PI/2;barrel.position.set(.22,-.13,-.55);
const gbody=new THREE.Mesh(new THREE.BoxGeometry(.1,.09,.3),gmat);
gbody.position.set(.22,-.16,-.38);
const grip=new THREE.Mesh(new THREE.BoxGeometry(.065,.13,.065),gmat);
grip.position.set(.22,-.26,-.3);
const scope=new THREE.Mesh(new THREE.CylinderGeometry(.018,.018,.12,8),gmat);
scope.rotation.x=Math.PI/2;scope.position.set(.22,-.08,-.42);
gunG.add(barrel);gunG.add(gbody);gunG.add(grip);gunG.add(scope);
camera.add(gunG);

// ── enemy builder ──────────────────────────────────
function buildEnemy(){
  const g=new THREE.Group();
  const mat1=new THREE.MeshLambertMaterial({color:0xcc1111,emissive:0x440000});
  const mat2=new THREE.MeshLambertMaterial({color:0xaa0f0f,emissive:0x330000});
  const eyeM=new THREE.MeshLambertMaterial({color:0xff6600,emissive:0xff3300});
  const darkM=new THREE.MeshLambertMaterial({color:0x661111});

  // torso
  const torso=new THREE.Mesh(new THREE.BoxGeometry(.7,.8,.45),mat1);
  torso.position.y=1.05;torso.castShadow=true;g.add(torso);

  // head
  const head=new THREE.Mesh(new THREE.BoxGeometry(.55,.55,.5),mat2);
  head.position.y=1.7;head.castShadow=true;g.add(head);

  // eyes
  [-0.13,0.13].forEach(ox=>{
    const eye=new THREE.Mesh(new THREE.SphereGeometry(.09,8,8),eyeM);
    eye.position.set(ox,1.75,-.27);g.add(eye);
    // eye glow
    const gl=new THREE.PointLight(0xff4400,1.5,2.5);
    gl.position.set(ox,1.75,-.27);g.add(gl);
  });

  // legs
  [-0.18,0.18].forEach(lx=>{
    const leg=new THREE.Mesh(new THREE.BoxGeometry(.22,.65,.22),darkM);
    leg.position.set(lx,.32,0);g.add(leg);
    const foot=new THREE.Mesh(new THREE.BoxGeometry(.22,.12,.3),darkM);
    foot.position.set(lx,.06,.06);g.add(foot);
  });

  // arms
  [-0.48,0.48].forEach(ax=>{
    const arm=new THREE.Mesh(new THREE.BoxGeometry(.2,.6,.2),mat1);
    arm.position.set(ax,.95,0);g.add(arm);
  });

  return g;
}

// ── state ─────────────────────────────────────────
let gameActive=false,locked=false;
let hp,score,ammo,wave,waveSize;
let enemies=[],bullets=[],flashes=[];
let yaw=0,pitch=0,keys={};
let reloading=false;
let ewKilled=0,ewTotal=0;
let hitTO=null,bobT=0;

function resetState(){
  hp=100;score=0;ammo=30;wave=1;waveSize=5;reloading=false;
  enemies.forEach(e=>scene.remove(e.grp));bullets.forEach(b=>scene.remove(b.m));
  enemies=[];bullets=[];flashes=[];ewKilled=0;ewTotal=0;
  camera.position.set(0,1.7,0);yaw=0;pitch=0;bobT=0;
  camera.rotation.order='YXZ';camera.rotation.set(0,0,0);
  set('hv',100);set('scv',0);set('av',30);set('wv',1);
}
function set(id,v){document.getElementById(id).textContent=v;}

function spawnEnemy(){
  const ang=Math.random()*Math.PI*2,dist=22+Math.random()*20;
  const x=Math.cos(ang)*dist,z=Math.sin(ang)*dist;
  const grp=buildEnemy();
  grp.position.set(x,0,z);
  scene.add(grp);
  const maxhp=3+wave;
  enemies.push({grp,hp:maxhp,maxhp,speed:.025+wave*.004,
    stimer:50+Math.random()*80,sint:Math.max(30,85-wave*7),alive:true});
}

function spawnWave(n){
  ewTotal=n;ewKilled=0;
  for(let i=0;i<n;i++) setTimeout(()=>{if(gameActive)spawnEnemy();},i*450);
  const a=document.getElementById('wann');
  a.textContent=`— WAVE ${wave} —`;a.style.opacity=1;
  setTimeout(()=>a.style.opacity=0,2200);
}

function shoot(){
  if(!gameActive||ammo<=0||reloading)return;
  ammo--;set('av',ammo);
  // flash
  const fl=new THREE.PointLight(0xffaa00,8,5);
  fl.position.copy(camera.position);scene.add(fl);flashes.push({l:fl,life:4});
  // recoil
  gunG.position.z=.07;gunG.rotation.x=-.09;
  setTimeout(()=>{gunG.position.z=0;gunG.rotation.x=0;},90);
  // bullet
  const dir=new THREE.Vector3();camera.getWorldDirection(dir);
  const bm=new THREE.Mesh(new THREE.SphereGeometry(.055,4,4),
    new THREE.MeshBasicMaterial({color:0xffee44}));
  bm.position.copy(camera.position).addScaledVector(dir,.9);
  scene.add(bm);
  bullets.push({m:bm,dir:dir.clone(),speed:1.4,life:70,player:true});
  if(ammo===0)reload();
}

function reload(){
  if(reloading)return;reloading=true;set('av','—');
  const bar=document.getElementById('rbar'),fill=document.getElementById('rfill');
  bar.style.display='block';fill.style.width='0%';
  setTimeout(()=>fill.style.width='100%',30);
  setTimeout(()=>{ammo=30;reloading=false;bar.style.display='none';
    fill.style.width='0%';set('av',ammo);},1500);
}

function takeDmg(n){
  hp-=n;set('hv',Math.max(0,Math.round(hp)));
  document.getElementById('dmg').style.background='rgba(255,0,0,.28)';
  setTimeout(()=>document.getElementById('dmg').style.background='rgba(255,0,0,0)',180);
  if(hp<=0&&gameActive)endGame();
}

function updateBullets(){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.m.position.addScaledVector(b.dir,b.speed);
    if(--b.life<=0){scene.remove(b.m);bullets.splice(i,1);continue;}
    if(b.player){
      let hit=false;
      for(let j=enemies.length-1;j>=0;j--){
        const en=enemies[j];if(!en.alive)continue;
        if(b.m.position.distanceTo(en.grp.position.clone().add(new THREE.Vector3(0,1,0)))<1.2){
          en.hp--;scene.remove(b.m);bullets.splice(i,1);hit=true;
          const hel=document.getElementById('hit');hel.style.opacity=1;
          clearTimeout(hitTO);hitTO=setTimeout(()=>hel.style.opacity=0,120);
          if(en.hp<=0){
            scene.remove(en.grp);en.alive=false;enemies.splice(j,1);
            score+=100*wave;set('scv',score);
            if(++ewKilled>=ewTotal&&gameActive){
              setTimeout(()=>{wave++;waveSize=5+wave*2;set('wv',wave);spawnWave(waveSize);},1800);
            }
          }
          break;
        }
      }
    }else{
      if(b.m.position.distanceTo(camera.position)<1.15){
        takeDmg(9);scene.remove(b.m);bullets.splice(i,1);
      }
    }
  }
}

function updateEnemies(){
  enemies.forEach(en=>{
    if(!en.alive)return;
    const d=new THREE.Vector3().subVectors(camera.position,en.grp.position);
    d.y=0;d.normalize();
    en.grp.position.addScaledVector(d,en.speed);
    en.grp.lookAt(camera.position.x,en.grp.position.y,camera.position.z);
    if(--en.stimer<=0){
      en.stimer=en.sint;
      const sd=d.clone();
      sd.x+=(Math.random()-.5)*.18;sd.z+=(Math.random()-.5)*.18;sd.normalize();
      const bm=new THREE.Mesh(new THREE.SphereGeometry(.07,4,4),
        new THREE.MeshBasicMaterial({color:0xff2222}));
      bm.position.copy(en.grp.position).add(new THREE.Vector3(0,1.5,0));
      scene.add(bm);
      bullets.push({m:bm,dir:sd,speed:.42,life:95,player:false});
    }
    if(en.grp.position.distanceTo(camera.position)<1.6)takeDmg(.22);
  });
}

// ── pointer lock ──────────────────────────────────
document.addEventListener('pointerlockchange',()=>{
  locked=document.pointerLockElement===canvas;
  document.getElementById('nolock').style.display=
    gameActive&&!locked?'block':'none';
});
document.addEventListener('mousemove',e=>{
  if(!locked||!gameActive)return;
  yaw-=e.movementX*.002;
  pitch=Math.max(-1.15,Math.min(1.15,pitch-e.movementY*.002));
  camera.rotation.order='YXZ';
  camera.rotation.y=yaw;
  camera.rotation.x=pitch;
});
document.addEventListener('mousedown',e=>{
  if(!gameActive)return;
  if(!locked){canvas.requestPointerLock?.();return;}
  if(e.button===0)shoot();
});
document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='KeyR'&&gameActive&&!reloading&&ammo<30)reload();
  if((e.code==='Space'||e.code==='KeyF')&&gameActive)shoot();
});
document.addEventListener('keyup',e=>keys[e.code]=false);

// ── game loop ─────────────────────────────────────
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);
  if(gameActive){
    let mx=0,mz=0;
    if(keys['KeyW']||keys['ArrowUp'])mz=-1;
    if(keys['KeyS']||keys['ArrowDown'])mz=1;
    if(keys['KeyA']||keys['ArrowLeft'])mx=-1;
    if(keys['KeyD']||keys['ArrowRight'])mx=1;
    if(mx||mz){
      const len=Math.sqrt(mx*mx+mz*mz);mx/=len;mz/=len;
      const sp=5*dt;
      camera.position.x+=(-Math.sin(yaw)*mz+Math.cos(yaw)*mx)*sp;
      camera.position.z+=(-Math.cos(yaw)*mz-Math.sin(yaw)*mx)*sp;
      bobT+=dt*7;
      camera.position.y=1.7+Math.sin(bobT)*.04;
    }else{
      camera.position.y+=(1.7-camera.position.y)*.12;
    }
    camera.position.x=Math.max(-48,Math.min(48,camera.position.x));
    camera.position.z=Math.max(-48,Math.min(48,camera.position.z));
    updateBullets();updateEnemies();
    for(let i=flashes.length-1;i>=0;i--)
      if(--flashes[i].life<=0){scene.remove(flashes[i].l);flashes.splice(i,1);}
    rl.position.x=Math.sin(Date.now()*.0009)*20;
    bl.position.z=Math.cos(Date.now()*.0011)*20;
  }
  renderer.render(scene,camera);
}
animate();

// ── start / end ───────────────────────────────────
function startGame(){
  document.getElementById('ss').style.display='none';
  document.getElementById('go').style.display='none';
  resetState();gameActive=true;
  canvas.requestPointerLock?.();
  spawnWave(waveSize);
}
function endGame(){
  gameActive=false;document.exitPointerLock?.();locked=false;
  document.getElementById('nolock').style.display='none';
  document.getElementById('go').style.display='flex';
  document.getElementById('fs').textContent=`SCORE ${score}  |  WAVE ${wave}`;
}

document.getElementById('sbtn').onclick=startGame;
document.getElementById('rbtn').onclick=startGame;

window.addEventListener('resize',()=>{
  W=innerWidth;H=innerHeight;
  renderer.setSize(W,H);camera.aspect=W/H;camera.updateProjectionMatrix();
});
</script>
</body>
</html>
